# Build an unsigned device IPA for sideloading (SideStore/AltStore).
#
# Nothing here changes the app: the same steps as ios-build.yml up to the engine
# tree and the generated project, then a Release build for a real iPhone with
# signing switched off, packed as Payload/DshIOS.app into a zip.
name: Unsigned IPA

on:
  push:
    paths:
      - ".github/workflows/unsigned-ipa.yml"
  workflow_dispatch:
  schedule:
    # 07:00 UTC: 15:00 Beijing, 02:00 US Eastern — the emptiest macOS pool.
    - cron: "0 7 * * *"

permissions:
  contents: read

concurrency:
  group: unsigned-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipa:
    runs-on: xcode-27
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: engine/package-lock.json

      - name: Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_27.2.app
          xcodebuild -version

      - name: Cache nodejs-mobile
        id: nodejs-mobile
        uses: actions/cache@v5
        with:
          path: |
            vendor/nodejs-mobile/ios
            vendor/nodejs-mobile/rooted
          key: nodejs-mobile-${{ hashFiles('scripts/fetch-nodejs-mobile.sh') }}

      - name: Fetch nodejs-mobile
        if: steps.nodejs-mobile.outputs.cache-hit != 'true'
        run: scripts/fetch-nodejs-mobile.sh

      - name: Cache Python
        id: python
        uses: actions/cache@v5
        with:
          path: |
            vendor/python/ios
            vendor/python/rooted
          key: python-${{ hashFiles('scripts/fetch-python.sh') }}

      - name: Fetch Python
        if: steps.python.outputs.cache-hit != 'true'
        run: scripts/fetch-python.sh

      - name: Check NodeMobile imports
        run: scripts/check-root-imports.sh

      - name: Cache libgit2
        id: libgit2
        uses: actions/cache@v5
        with:
          path: |
            vendor/libgit2/Libgit2.xcframework
            vendor/libgit2/ios-arm64
            vendor/libgit2/ios-arm64-simulator
            vendor/libgit2/macos
          key: libgit2-${{ runner.os }}-${{ hashFiles('scripts/build-libgit2.sh') }}

      - name: Build libgit2
        if: steps.libgit2.outputs.cache-hit != 'true'
        run: scripts/build-libgit2.sh

      - name: Cache FFmpeg
        id: ffmpeg
        uses: actions/cache@v5
        with:
          path: vendor/ffmpeg/FFmpeg.xcframework
          key: ffmpeg-${{ runner.os }}-${{ hashFiles('scripts/fetch-ffmpeg.sh', 'scripts/build-ffmpeg.sh', 'native/ffmpeg/**') }}

      - name: Fetch FFmpeg
        if: steps.ffmpeg.outputs.cache-hit != 'true'
        run: scripts/fetch-ffmpeg.sh

      - name: Assemble engine
        run: scripts/build-engine.sh

      # The phone's Rust library: pairing, developer-image mounting and the runner. Its
      # build is the slow part, so it is cached by Cargo.lock and skipped when it hits.
      - name: Rust toolchain
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup target add aarch64-apple-ios

      - name: Fetch idevice
        run: bash native/poki-launcher/fetch-idevice.sh

      - name: Cache cargo
        id: cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/poki-launcher/target
          key: cargo-${{ hashFiles('native/poki-launcher/Cargo.lock') }}

      - name: Build the launcher
        env:
          # Xcode 27.2's tools are LLVM 21; Rust 1.100 is LLVM 23 and embeds a bitcode
          # module in every object it writes, which nm and ld then refuse to read
          # ("Unknown attribute kind (105)"). Nothing here goes through the App Store,
          # so the section is dead weight: leave it out.
          RUSTFLAGS: "-C embed-bitcode=no"
        run: |
          set -euo pipefail
          cargo build --release --target aarch64-apple-ios --manifest-path native/poki-launcher/Cargo.toml
          lib=native/poki-launcher/target/aarch64-apple-ios/release/libpoki_launcher.a
          ls -la "$lib"
          (nm -g "$lib" 2>/dev/null | grep -E '_poki_(launcher|pair)_' | sort -u | head -20) || echo "no poki_ symbols listed"
          mkdir -p vendor/poki-launcher
          cp "$lib" vendor/poki-launcher/

      - name: Generate project
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          cd app && xcodegen generate --quiet

      # Unsigned device build. Everything that needs a team is switched off, so the
      # product is a bare .app that a sideloading tool signs afterwards.
      - name: Build (device, unsigned)
        working-directory: app
        run: |
          xcodebuild -project DshIOS.xcodeproj -scheme DshIOS -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            EXPANDED_CODE_SIGN_IDENTITY="" PROVISIONING_PROFILE_SPECIFIER="" \
            build

      # 出一个能直接侧载的包：符号链接展开、Watch 摘掉、rpath 自检。
      # 这些以前是出包后手动改的，每轮都可能漏，现在交给流水线。
      - name: Package IPA
        run: |
          set -euo pipefail
          APP=$(find app/build/DerivedData/Build/Products -maxdepth 4 -name 'DshIOS.app' -type d | head -1)
          echo "app: $APP"
          [ -d "$APP" ] || { echo "no DshIOS.app was produced"; find app/build/DerivedData/Build/Products -maxdepth 3 -type d | head -20; exit 1; }

          rm -rf dist
          mkdir -p dist/Payload
          # -L 把 node_modules 的平台包和 .bin 里的命令这些链接换成真实文件：
          # SideStore 装进去以后是不跟着符号链接的，上回就是它让引擎起不来。
          # --exclude Watch 摘掉 Watch 伴侣 App，不然报 InvalidCompanionAppBundleIdentifier。
          rsync -aL --exclude 'Watch' "$APP" dist/Payload/
          rm -rf dist/Payload/DshIOS.app/Watch

          # 自检：主二进制得有这两条 rpath，否则手机操控缺库。
          BIN=dist/Payload/DshIOS.app/DshIOS
          for rp in /System/Developer/usr/lib /System/Developer/Library/PrivateFrameworks; do
            if ! grep -q "$rp" "$BIN"; then echo "missing rpath: $rp"; exit 1; fi
            echo "rpath ok: $rp"
          done
          # 自检：Payload 里不该再有链接。
          LINKS=$(find dist/Payload -type l | wc -l | tr -d ' ')
          if [ "$LINKS" != "0" ]; then
            echo "symlinks left in Payload ($LINKS):"
            find dist/Payload -type l | head -20
            exit 1
          fi
          echo "symlinks: 0"

          cd dist
          zip -qry -X fish-pocket-unsigned.ipa Payload
          ls -lh fish-pocket-unsigned.ipa
          unzip -l fish-pocket-unsigned.ipa | tail -3

      - uses: actions/upload-artifact@v4
        with:
          name: fish-pocket-unsigned-ipa
          path: dist/fish-pocket-unsigned.ipa
          retention-days: 14
